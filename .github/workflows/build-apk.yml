name: Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'patches/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - 'debug'
          - 'release'
      repo_url:
        description: '官方仓库地址'
        required: true
        default: 'https://github.com/hefy2027/cf-manager.git'
      branch:
        description: '官方仓库分支'
        required: true
        default: 'master'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
    
    env:
      REPO_URL: ${{ github.event.inputs.repo_url || 'https://github.com/hefy2027/cf-manager.git' }}
      BRANCH: ${{ github.event.inputs.branch || 'master' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708
          packages: ''

      - name: 接受 Android SDK 许可
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;34.0.0"
          echo "✅ Android SDK 已就绪"

      - name: 克隆官方源码
        run: |
          echo "从 $REPO_URL ($BRANCH) 克隆..."
          git clone --depth 1 -b "$BRANCH" "$REPO_URL" tmp_build
          
          if [ ! -d "tmp_build/backend" ] || [ ! -d "tmp_build/frontend" ]; then
            echo "❌ 源码结构不正确，缺少 backend 或 frontend 目录"
            exit 1
          fi
          
          echo "✅ 源码克隆完成"

      - name: 构建前端
        run: |
          cd tmp_build/frontend
          echo "安装前端依赖..."
          npm install
          echo "执行前端构建..."
          npm run build
          
          if [ ! -d "dist" ]; then
            echo "❌ 前端构建失败，dist 目录不存在"
            exit 1
          fi
          echo "✅ 前端构建完成"

      - name: 编译后端 + Android 适配
        run: |
          cd tmp_build/backend
          
          echo "安装后端依赖（含 TypeScript 编译工具）..."
          npm install
          
          echo "编译 TypeScript..."
          npm run build
          
          if [ ! -d "dist" ]; then
            echo "❌ 编译失败，dist 目录不存在"
            exit 1
          fi
          echo "✅ TypeScript 编译完成"
          
          echo "移除 better-sqlite3，添加 sql.js..."
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.dependencies) delete pkg.dependencies['better-sqlite3'];
            if (pkg.devDependencies) delete pkg.devDependencies['@types/better-sqlite3'];
            if (!pkg.dependencies) pkg.dependencies = {};
            pkg.dependencies['sql.js'] = '^1.14.2';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('✅ package.json 已更新');
          "
          
          echo "重新安装运行时依赖（sql.js 替换 better-sqlite3）..."
          rm -rf node_modules
          npm install --omit=dev
          
          if [ ! -d "node_modules/sql.js" ]; then
            echo "❌ sql.js 安装失败"
            exit 1
          fi
          echo "✅ sql.js 已安装"
          
          echo "替换数据库层为 sql.js 兼容版..."
          cp "$GITHUB_WORKSPACE/patches/db.js" dist/db.js
          
          echo "修正前端静态文件路径（dist 扁平化后 public 同级）..."
          sed -i "s|path_1.default.join(__dirname, '..', 'public')|path_1.default.join(__dirname, 'public')|g" dist/index.js
          sed -i "s|path_1.default.join(path_1.default.join(__dirname, '..', 'public'), 'index.html')|path_1.default.join(__dirname, 'public', 'index.html')|g" dist/index.js
          
          echo "注入 sql.js 异步初始化（initDbAsync）..."
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('dist/index.js', 'utf8');
            content = content.replace(
              /(async function start\(\)\s*\{[\s\S]*?)(\(0, [a-zA-Z_\$][\w\$]*\.initDb\)\(\);)/,
              '\$1    if (typeof db_1.initDbAsync === \"function\") {\n        await db_1.initDbAsync();\n    }\n    \$2'
            );
            fs.writeFileSync('dist/index.js', content);
            console.log('✅ 异步初始化已注入');
          "
          
          echo "复制前端构建产物到后端 public 目录..."
          rm -rf public
          cp -r "$GITHUB_WORKSPACE/tmp_build/frontend/dist" public
          
          echo "✅ 后端适配完成"

      - name: 组装 assets/backend
        run: |
          echo "清理旧 assets..."
          rm -rf app/src/main/assets/backend
          mkdir -p app/src/main/assets/backend
          
          # 复制编译后的 JS 文件（dist 内容扁平化到 assets/backend 根目录）
          echo "复制编译后的后端代码..."
          cp -r tmp_build/backend/dist/* app/src/main/assets/backend/
          
          # 复制运行时依赖和配置
          echo "复制运行时依赖..."
          cp -r tmp_build/backend/node_modules app/src/main/assets/backend/
          cp tmp_build/backend/package.json app/src/main/assets/backend/
          cp tmp_build/backend/package-lock.json app/src/main/assets/backend/
          
          # 复制前端静态文件
          echo "复制前端静态文件..."
          cp -r tmp_build/backend/public app/src/main/assets/backend/
          
          size=$(du -sh app/src/main/assets/backend | cut -f1)
          echo "✅ Assets 组装完成（总大小: $size）"

      - name: 清理开发文件（source map + 类型声明）
        run: |
          echo "清理 .map 和 .d.ts 文件（运行时不需要）..."
          
          before_size=$(du -sb app/src/main/assets/backend | cut -f1)
          map_count=$(find app/src/main/assets/backend -type f -name "*.map" | wc -l)
          dts_count=$(find app/src/main/assets/backend -type f -name "*.d.ts" | wc -l)
          total=$((map_count + dts_count))
          
          if [ "$total" -gt 0 ]; then
            find app/src/main/assets/backend -type f \( -name "*.map" -o -name "*.d.ts" \) -delete
            after_size=$(du -sb app/src/main/assets/backend | cut -f1)
            saved_bytes=$((before_size - after_size))
            saved_kb=$((saved_bytes / 1024))
            echo "已删除 $total 个开发文件（.map: $map_count, .d.ts: $dts_count），节省 ${saved_kb} KB"
          else
            echo "未找到开发文件，无需清理"
          fi
          
          echo "✅ 开发文件清理完成"

      - name: 清理临时文件
        if: always()
        run: |
          rm -rf tmp_build
          echo "🧹 临时文件已清理"

      - name: 检查 jniLibs 原生库
        run: |
          JNI_DIR="app/src/main/jniLibs/arm64-v8a"
          REQUIRED_LIBS=(
            "libc++_shared.so" "libcares.so" "libcrypto3.so" "libffi.so"
            "libicudata78.so" "libicui18n78.so" "libicuuc78.so" "libnode.so"
            "libsqlite3.so" "libssl3.so" "libz1.so"
          )
          
          missing=0
          for lib in "${REQUIRED_LIBS[@]}"; do
            if [ ! -f "$JNI_DIR/$lib" ]; then
              echo "❌ 缺失: $lib"
              missing=1
            fi
          done
          
          if [ $missing -ne 0 ]; then
            echo "原生库不完整，请确保 .so 文件在 $JNI_DIR 目录中"
            exit 1
          fi
          
          echo "✅ 所有原生库就绪"
          du -sh "$JNI_DIR"

      - name: 授予 Gradle 执行权限
        run: |
          chmod +x ./gradlew
          echo "✅ gradlew 已就绪"

      - name: 缓存 Gradle 依赖
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper

      - name: 构建 Debug APK
        if: github.event.inputs.build_type != 'release'
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 构建 Release APK
        if: github.event.inputs.build_type == 'release'
        run: |
          # 签名配置已在 signing/ 目录中（signing.properties + release.jks）
          # build.gradle 会自动读取并签名
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 获取版本信息
        id: version
        run: |
          VERSION_NAME=$(grep -oP "versionName\s+['\"]\K[^'\"]+" app/build.gradle | head -1)
          VERSION_CODE=$(grep -oP "versionCode\s+\K\d+" app/build.gradle | head -1)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "版本: $VERSION_NAME ($VERSION_CODE)"

      - name: 查找 APK 文件
        id: find_apk
        run: |
          APK_COUNT=$(find app/build/outputs/apk -name "*.apk" | wc -l)
          echo "找到 $APK_COUNT 个 APK 文件:"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "❌ 未找到 APK 文件，构建失败"
            exit 1
          fi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v6
        with:
          name: cf-manager-android-v${{ steps.version.outputs.version_name }}
          path: |
            app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 发布到 GitHub Release
        if: github.event.inputs.build_type == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: v${{ steps.version.outputs.version_name }}
          body: |
            ## cf-manager-android v${{ steps.version.outputs.version_name }}

            **官方仓库**: ${{ env.REPO_URL }} (${{ env.BRANCH }})
            **版本号**: v${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})
            **构建类型**: Release

            > 源码包与 APK 同步发布
          files: |
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: 输出构建结果
        run: |
          echo ""
          echo "========================================"
          echo " APK 构建完成!"
          echo "========================================"
          echo ""
          echo "官方仓库: $REPO_URL ($BRANCH)"
          echo "版本: v${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})"
          echo ""
          echo "APK 文件:"
          find app/build/outputs/apk -name "*.apk" -exec echo "  - {}" \;
          echo ""
          echo "产物已上传到 Artifacts，可在 Action 页面下载"
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo ""
            echo "✅ Release 版本已发布到 GitHub Release（源码与 APK 同步发布）"
          fi
