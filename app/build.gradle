plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 读取签名配置
def signingPropsFile = rootProject.file("signing/signing.properties")
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

android {
    namespace 'com.cfmanager.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.cfmanager.app"
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "2.1.0-ab4ae1c"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // 启用 Jetpack Compose
    buildFeatures {
        compose true
    }

    // 签名配置（从 signing/signing.properties 读取）
    signingConfigs {
        release {
            if (signingPropsFile.exists()) {
                storeFile rootProject.file(signingProps['storeFile'] ?: 'signing/release.jks')
                storePassword signingProps['storePassword'] ?: ''
                keyAlias signingProps['keyAlias'] ?: ''
                keyPassword signingProps['keyPassword'] ?: ''
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 如果签名配置存在则使用，否则构建未签名的 release APK
            if (signingPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        // Don't compress Node.js binaries and libraries
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    
    // Prevent compression of asset files that need to be executable
    // Also don't ignore _prefixed files/directories (cloudflare has _shims dir)
    aaptOptions {
        noCompress 'node', '.so', '.wasm', '.dat', '.db'
        // Default pattern ignores _* dirs; we override to keep them
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity-compose:1.9.3'

    // Jetpack Compose
    implementation 'androidx.compose.ui:ui:1.7.5'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.5'
    implementation 'androidx.compose.material3:material3:1.3.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.5'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.5'

    // Miuix - MIUI 风格 UI 库
    implementation 'top.yukonga.miuix.kmp:miuix-android:0.8.8'
}
